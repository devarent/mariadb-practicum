services:
  mariadb:
    image: mariadb:11
    container_name: practicum-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-REPLACE_ME}
      MARIADB_DATABASE: ${DB_NAME:-hris}
      MARIADB_USER: ${DB_USER:-REPLACE_ME}
      MARIADB_PASSWORD: ${DB_PASSWORD:-REPLACE_ME}
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./db/procedures.sql:/docker-entrypoint-initdb.d/03_procedures.sql:ro
      - ./db/triggers.sql:/docker-entrypoint-initdb.d/04_triggers.sql:ro
      - ./db/queries.sql:/docker-entrypoint-initdb.d/05_queries.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5
    container_name: practicum-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-REPLACE_ME}
      PMA_PASSWORD: ${DB_PASSWORD:-REPLACE_ME}
      UPLOAD_LIMIT: 16M
    ports:
      - "8080:80"

volumes:
  mariadb-data:
